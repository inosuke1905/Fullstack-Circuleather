# Installation SQL and development tests are not public web endpoints.
<Directory /var/www/html/circuleather/database>
    Require all denied
</Directory>

<Directory /var/www/html/circuleather/tests>
    Require all denied
</Directory>

# Material uploads are served as files; executable extensions are never exposed.
<Directory /var/www/html/circuleather/uploads>
    Options -Indexes -ExecCGI
    AllowOverride None
    <FilesMatch "\.(?i:php|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
