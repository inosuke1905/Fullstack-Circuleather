; Runtime settings for the client installation; the website's PHP code stays the same.
date.timezone = Europe/Amsterdam
display_errors = Off
log_errors = On
expose_php = Off

; Match the form's 5 MB image limit and allow two photos in one submission.
upload_max_filesize = 5M
post_max_size = 12M

; Keep authentication cookies inaccessible to JavaScript and restrict cross-site sends.
session.cookie_httponly = 1
session.cookie_samesite = Lax
